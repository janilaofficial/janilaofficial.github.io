<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janila Prabashwara | Portfolio</title>
    <style>
        :root {
            --orange: #ffa31a;
            --dark-surface: #292929;
            --dark-bg: #1b1b1b;
            --gray: #808080;
            --white: #ffffff;
        }
        body {
            background-color: var(--dark-bg);
            color: var(--white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: var(--dark-surface);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid var(--orange);
        }
        header h1 { margin: 0; color: var(--white); font-size: 2.5rem; }
        header h1 span { color: var(--orange); }
        header p { color: var(--gray); margin-top: 10px; }
        
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background-color: var(--dark-surface);
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        
        /* Social Links CSS */
        .social-links {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .social-btn {
            background-color: var(--dark-bg);
            color: var(--orange);
            border: 2px solid var(--orange);
            padding: 12px 20px;
            border-radius: 8px;
            width: 280px;
            text-align: center;
            font-size: 1rem;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .social-btn:hover {
            background-color: var(--orange);
            color: var(--dark-bg);
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: var(--gray);
        }
    </style>
</head>
<body>
    <header>
        <h1>Janila <span>Prabashwara</span></h1>
        <p>Founder of Iconic LK</p>
    </header>
    
    <div class="container">
        <h2>Welcome to My New Space</h2>
        <p>This is my custom portfolio built with pure HTML & CSS, hosted seamlessly on GitHub Pages.</p>
        
        <div class="social-links">
            <!-- Personal Facebook -->
            <a href="https://www.facebook.com/janilaofficial" target="_blank" class="social-btn">Janila Dissanayake</a>
            
            <!-- Iconic LK Facebook -->
            <a href="https://www.facebook.com/iconiclk.srilanka" target="_blank" class="social-btn">Iconic LK Page</a>
            
            <!-- Email -->
            <a href="mailto:ව්janilaprabashwaraofficial@gmail.com" class="social-btn">Email Me</a>
            
            <!-- WhatsApp -->
            <a href="https://wa.me/94718892936" target="_blank" class="social-btn">WhatsApp</a>
        </div>
    </div>

    <footer>
        &copy; 2025 Janila Prabashwara. Engineered by Janila.
    </footer>
</body>
</html>
